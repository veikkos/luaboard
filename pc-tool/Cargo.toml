[package]
name = "luaboard-tools"
version = "1.0.0"
edition = "2021"
description = "PC tools for luaboard: install and control Lua apps over USB or Wi-Fi"
license = "MIT"

[lib]
name = "luaboard"
path = "src/lib.rs"

[[bin]]
name = "luaboard"
path = "src/bin/luaboard.rs"

[[bin]]
name = "luaboard-studio"
path = "src/bin/luaboard-studio/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
eframe = "0.37.0"
espflash = { version = "4.7.0", default-features = false, features = ["serialport"] }
getrandom = "0.3.4"
mdns-sd = "0.21.7"
rfd = "0.17.2"
serialport = "4.10.1"
sha2 = "0.11.1"

[build-dependencies]
cc = "1.11.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Pipes"] }

[dev-dependencies]
flate2 = "1.1.11"
rcgen = "0.14.10"
regex = "1.13.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"

# The end-to-end suite: simulators driven by the CLI, against fake servers
# (cargo test --release --test e2e [-- WORD...]). Its own runner, see main.rs.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
harness = false
